name: ASAAS Release CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions: {}

jobs:
  release-preflight:
    name: ASAAS Release Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Install the locked project dependencies
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry install --with dev --no-root

      - name: Validate build and release preflight contracts
        run: |
          set -euo pipefail
          poetry run python scripts/validate_asaas_producer_release_readbacks.py --check-template
          poetry run pytest -q -p no:cacheprovider \
            tests/scripts/test_asaas_producer_release_readbacks.py \
            tests/scripts/test_asaas_build_workflow.py \
            tests/scripts/test_asaas_release_preflight_workflow.py \
            tests/scripts/test_package_asaas_build_ui_evidence.py \
            tests/scripts/test_sign_asaas_build_attestation.py \
            tests/api/test_billing_producer_build_trust.py \
            tests/scripts/test_production_infra.py
