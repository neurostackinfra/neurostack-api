# ============================================
# NeuroStack API - Prometheus Configuration
# ============================================
# Configuração completa com scraping, alertas e recording rules

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'development'
    service: 'neurostack'

# Configuração do Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      timeout: 10s
      api_version: v2

# Arquivos de regras (alertas e recording rules)
rule_files:
  - /etc/prometheus/prometheus_rules.yml

# Configurações de scraping
scrape_configs:
  # =====================
  # Prometheus self-monitoring
  # =====================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'

  # =====================
  # NeuroStack API metrics
  # =====================
  - job_name: 'neurostack-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    # Labels adicionais
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.*):.*'
        replacement: '${1}'

  # =====================
  # Redis metrics
  # =====================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # =====================
  # PostgreSQL metrics
  # =====================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # =====================
  # Alertmanager
  # =====================
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: '/metrics'

  # =====================
  # Grafana
  # =====================
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'
    scrape_interval: 60s

  # =====================
  # Loki (Log aggregation)
  # =====================
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: '/metrics'
    scrape_interval: 30s
