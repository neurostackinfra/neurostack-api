services:
  api:
    image: ${GEMINI_IMAGE_DIGEST:?checker-approved repository@sha256 digest required}
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?strong production SECRET_KEY required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?explicit production origins required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?explicit production hosts required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:?required}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:?required}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:?required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_API_KEY: ${QDRANT_API_KEY:?strong Qdrant API key required}
      ASAAS_API_KEY: ${ASAAS_API_KEY:?ASAAS production API key required}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?ASAAS webhook token required}
      ASAAS_USER_AGENT: ${ASAAS_USER_AGENT:-NeuroStack/asaas-payment-gateway}
      ASAAS_PROVIDER_EVIDENCE_KEY_ID: ${ASAAS_PROVIDER_EVIDENCE_KEY_ID:?ASAAS provider evidence key id required}
      ASAAS_PROVIDER_EVIDENCE_PUBLIC_KEY: ${ASAAS_PROVIDER_EVIDENCE_PUBLIC_KEY:?ASAAS provider evidence public key required}
      ABACATEPAY_API_KEY: ${ABACATEPAY_API_KEY:-}
      ABACATEPAY_WEBHOOK_SECRET: ${ABACATEPAY_WEBHOOK_SECRET:?legacy webhook secret required}
      BILLING_OPERATION_RECEIPT_SIGNING_KEY: ${BILLING_OPERATION_RECEIPT_SIGNING_KEY:?billing receipt signing key required}
      BILLING_PROMETHEUS_RULES_DIGEST: ${BILLING_PROMETHEUS_RULES_DIGEST:?Prometheus rules digest required}
      BILLING_PROMETHEUS_RULES_PATH: /etc/neurostack/prometheus_rules.yml
      BILLING_OBSERVABILITY_SMOKE_DIGEST: ${BILLING_OBSERVABILITY_SMOKE_DIGEST:?observability smoke digest required}
      BILLING_OBSERVABILITY_SMOKE_TOKEN: ${BILLING_OBSERVABILITY_SMOKE_TOKEN:?observability smoke token required}
      BILLING_OBSERVABILITY_SMOKE_PATH: /etc/neurostack/billing-observability-smoke.json
      BILLING_FACT_SCHEMA_DIGEST: ${BILLING_FACT_SCHEMA_DIGEST:?billing fact schema digest required}
      BILLING_OBSERVABILITY_ACKNOWLEDGEMENT: ${BILLING_OBSERVABILITY_ACKNOWLEDGEMENT:?fresh runtime acknowledgement evidence required}
      BILLING_OBSERVABILITY_ACKNOWLEDGEMENT_DIGEST: ${BILLING_OBSERVABILITY_ACKNOWLEDGEMENT_DIGEST:?runtime acknowledgement digest required}
      BILLING_ALERT_RECEIVER_URL: ${BILLING_ALERT_RECEIVER_URL:?non-loopback HTTPS alert receiver required}
    configs:
      - source: prometheus_rules
        target: /etc/neurostack/prometheus_rules.yml
      - source: billing_observability_smoke
        target: /etc/neurostack/billing-observability-smoke.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks: [neurostack-production]

  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?non-default database user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?strong database password required}
      POSTGRES_DB: ${POSTGRES_DB:?non-default database name required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [neurostack-production]

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?strong Redis password required}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [neurostack-production]

  qdrant:
    image: qdrant/qdrant@sha256:6ac4807063bbecddca0250bfbcff52acf18c22263b904d12919349e6d0a408f1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?strong Qdrant API key required}
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [neurostack-production]

  prometheus:
    image: prom/prometheus@sha256:6573196e5dbe834779ac4d34cb053113cc502a69e9e20ba3be96d37f33e81545
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle=false
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/prometheus_rules.yml
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started
      alertmanager:
        condition: service_started
    networks: [neurostack-production]

  alertmanager:
    image: prom/alertmanager@sha256:5ba0431d6cb9bda30640de0a8c2c41ecad12bd78847def3e5907e626ed5a49e9
    restart: unless-stopped
    environment:
      BILLING_ALERT_RECEIVER_URL: ${BILLING_ALERT_RECEIVER_URL:?non-loopback HTTPS alert receiver required}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env=true
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - alertmanager_data:/alertmanager
    networks: [neurostack-production]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  alertmanager_data:

configs:
  prometheus_config:
    file: ./config/prometheus.yml
  prometheus_rules:
    file: ./config/prometheus_rules.yml
  alertmanager_config:
    file: ./config/alertmanager/alertmanager.yml
  billing_observability_smoke:
    file: ./config/billing-observability-smoke.json

networks:
  neurostack-production:
