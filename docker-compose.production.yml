services:
  api:
    image: ${GEMINI_IMAGE_DIGEST:?checker-approved repository@sha256 digest required}
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?strong production SECRET_KEY required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?explicit production origins required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?explicit production hosts required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:?required}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:?required}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:?required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_API_KEY: ${QDRANT_API_KEY:?strong Qdrant API key required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks: [neurostack-production]

  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?non-default database user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?strong database password required}
      POSTGRES_DB: ${POSTGRES_DB:?non-default database name required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [neurostack-production]

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?strong Redis password required}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [neurostack-production]

  qdrant:
    image: qdrant/qdrant@sha256:6ac4807063bbecddca0250bfbcff52acf18c22263b904d12919349e6d0a408f1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?strong Qdrant API key required}
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [neurostack-production]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  neurostack-production:
