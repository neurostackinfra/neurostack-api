# DEVELOPMENT stack only. Compose interpolates the whole file when it loads it,
# so every command that reads this file (up, down -v, run, exec, logs, config,
# ...) aborts here unless NEUROSTACK_DEV_STACK is set: a production checkout
# shares this file's Compose project name, postgres_data volume and .env, and
# scripts/deploy-vps.sh refuses the key in the production .env. Set
# NEUROSTACK_DEV_STACK=1 in your local dev .env (see .env.example). ANY
# non-empty value enables this file (NEUROSTACK_DEV_STACK=0 does too); never set
# it on a production host.
x-neurostack-dev-stack: "${NEUROSTACK_DEV_STACK:?this is the DEVELOPMENT compose file (docker-compose.yml) and must never run on the production checkout; set NEUROSTACK_DEV_STACK=1 in your local dev .env (any non-empty value enables it, even 0; never set it on a production host)}"

services:
  # Development only. Every command of this service passes through
  # scripts/guard_alembic_upgrade_head.py first, which refuses unless the target
  # is a development database: on a production checkout (the VPS shares this
  # Compose project name, the postgres_data volume and the .env) the production
  # POSTGRES_* identifiers and ENVIRONMENT make it refuse before Alembic runs.
  # The guard's override is deliberately not forwarded into this container.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint:
      - sh
      - -c
      - 'python scripts/guard_alembic_upgrade_head.py && exec "$$@"'
      - guard_alembic_upgrade_head
    command: ["alembic", "upgrade", "head"]
    environment:
      - ENVIRONMENT=development
      - NEUROSTACK_CHECKOUT_ENVIRONMENT=${ENVIRONMENT:-}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # The image (production stage) ships only scripts/bootstrap_admin.py.
      - ./scripts/guard_alembic_upgrade_head.py:/app/scripts/guard_alembic_upgrade_head.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - neurostack-network
    restart: "no"

  # ============================================
  # NeuroStack API
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - METRICS_ENABLED=true
      - TRACING_ENABLED=true
    volumes:
      - ./src:/app/src
      - ./packages/neurostack-core:/app/packages/neurostack-core
      - ./tests:/app/tests
      - ./config:/app/config
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - neurostack-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service,environment"

  # ============================================
  # PostgreSQL - Event Store & Sessions
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: neurostack-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neurostack-network
    restart: unless-stopped

  # ============================================
  # Redis - State Store (OLTP)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: neurostack-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neurostack-network
    restart: unless-stopped

  # ============================================
  # Qdrant - Vector Database (RAG)
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neurostack-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - neurostack-network
    restart: unless-stopped

  # Group 4b: development-only, versioned S3-compatible target for the
  # additive credit copy. RustFS implements the S3 versioning/Object-Lock
  # APIs used by the integration tests; the test harness creates its own
  # Object-Lock bucket. API code remains inert without explicit settings.
  object-store:
    image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    command: server /data
    environment:
      RUSTFS_ACCESS_KEY: credit-test
      RUSTFS_SECRET_KEY: credit-test-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_store_data:/data
    networks:
      - neurostack-network
    restart: unless-stopped

  # ============================================
  # Observability - Grafana
  # ============================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: neurostack-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=neurostack
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/neurostack-overview.json
      - GF_DATASOURCES_ALLOW_EDIT=true
      - GF_DATASOURCES_ALLOW_DELETE=true
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DATASOURCES_DEFAULT_MAX_DATA_POINTS=1000
      - GF_LOG_LEVEL=info
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-piechart-panel
      - GF_DATASOURCES_PROVISIONING_ALLOW_DELETE=true
      - GF_DATASOURCES_PROVISIONING_ALLOW_EDIT=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
      - neurostack-network
    restart: unless-stopped
    profiles:
      - observability

  # ============================================
  # Prometheus - Metrics
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: neurostack-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neurostack-network
    restart: unless-stopped
    profiles:
      - observability

  # ============================================
  # Alertmanager - Alert Routing
  # ============================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: neurostack-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - neurostack-network
    restart: unless-stopped
    profiles:
      - observability

  # ============================================
  # Loki - Log Aggregation
  # ============================================
  loki:
    image: grafana/loki:2.9.0
    container_name: neurostack-loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: 
      - -config.file=/etc/loki/local-config.yaml
      - -target=all
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - neurostack-network
    restart: unless-stopped
    profiles:
      - observability

  # ============================================
  # Promtail - Log Collection Agent
  # ============================================
  promtail:
    image: grafana/promtail:2.9.0
    container_name: neurostack-promtail
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - neurostack-network
    restart: unless-stopped
    profiles:
      - observability

  # ============================================
  # Redis Exporter - Redis Metrics
  # ============================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: neurostack-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - neurostack-network
    restart: unless-stopped
    profiles:
      - observability

  # ============================================
  # Postgres Exporter - PostgreSQL Metrics
  # ============================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: neurostack-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      - postgres
    networks:
      - neurostack-network
    restart: unless-stopped
    profiles:
      - observability

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  object_store_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  neurostack-network:
    driver: bridge
