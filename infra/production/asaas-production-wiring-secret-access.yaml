AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Group 9 D3: lets the existing ECS execution role resolve exactly the three
  secrets the production-serving task definition references for ASAAS billing,
  and creates the billing observability smoke token with a value generated
  inside Secrets Manager. It reads no secret value, changes no ECS resource and
  never edits the Terraform-managed inline policy segredos-e-logs.
Metadata:
  com.aws.cloudformation.Context:
    arch: one additive, separately named inline policy on the Terraform-managed execution role (same pattern as the release stack's task-signing policy on the task role) plus one CloudFormation-owned secret
    must:
      - Grant only secretsmanager:GetSecretValue and only on the three exact secret ARNs; no wildcard, no other secret, no KMS or logs change.
      - The two existing ARNs, random suffix included, are resolved from DescribeSecret at plan time by scripts/asaas_production_wiring.py; never type or guess a suffix.
      - The smoke token value is generated inside Secrets Manager; it never appears in the repository, a parameter, an output, a log or a shell.
      - The smoke token uses the customer-managed key of its sibling secrets so the existing kms:Decrypt grant in segredos-e-logs covers it.
      - Never modify segredos-e-logs, AmazonECSTaskExecutionRolePolicy, the task role or any ECS resource.
      - Rolling the service back to the previous task definition does not require deleting this stack; the grant is additive and may stay.
    ref:
      - at: infra/production/asaas-production-wiring.yaml
        has: ordered D3/D4 plan, gates, task definition derivation and rollback
        scope: operations
      - at: .genie/wishes/asaas-payment-gateway/WISH.md
        has: Group 9 deliverables 3 and 4
        scope: acceptance contract
Rules:
  ProductionServingAccountRegionBoundary:
    Assertions:
      - Assert: !Equals [!Ref AWS::AccountId, '388460142431']
        AssertDescription: Wiring resources belong only to the verified AWS account.
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: Wiring resources belong only to the verified AWS region.
Parameters:
  AsaasApiKeySecretArn:
    Type: String
    Description: Exact ARN of neurostack/staging/asaas-api-key, read back with DescribeSecret at plan time.
    AllowedPattern: '^arn:aws:secretsmanager:us-east-1:388460142431:secret:neurostack/staging/asaas-api-key-[A-Za-z0-9]{6}$'
    ConstraintDescription: Must be the exact existing ASAAS API key secret ARN.
  AsaasWebhookTokenSecretArn:
    Type: String
    Description: Exact ARN of neurostack/staging/asaas-webhook-token, read back with DescribeSecret at plan time.
    AllowedPattern: '^arn:aws:secretsmanager:us-east-1:388460142431:secret:neurostack/staging/asaas-webhook-token-[A-Za-z0-9]{6}$'
    ConstraintDescription: Must be the exact existing ASAAS webhook token secret ARN.
Resources:
  BillingObservabilitySmokeTokenSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: BILLING_OBSERVABILITY_SMOKE_TOKEN authenticates the billing alert smoke; a task definition revision references it by ARN
        must:
          - Value is generated by Secrets Manager as 64 ASCII letters and digits with no whitespace or punctuation.
          - Encrypt with the sibling secrets' customer-managed key.
          - Retain on stack deletion or replacement, because a registered task definition revision may still reference it.
        mutable: change-with-constraints
        mutability:
          Name: must-never-change
          KmsKeyId: must-never-change
    Properties:
      Name: neurostack/staging/billing-observability-smoke-token
      Description: Billing observability smoke token for the production-serving ECS service.
      KmsKeyId: arn:aws:kms:us-east-1:388460142431:key/90eff49a-c2bf-4836-834f-d5666294d956
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: true
      Tags:
        - Key: Project
          Value: neurostack-api
        - Key: Owner
          Value: sre
        - Key: ManagedBy
          Value: cloudformation
        - Key: CostCenter
          Value: poc
        - Key: DataClassification
          Value: confidential
        - Key: Environment
          Value: staging
        - Key: Name
          Value: neurostack/staging/billing-observability-smoke-token

  ExecutionRoleWiringSecretRead:
    Type: AWS::IAM::Policy
    Metadata:
      com.aws.cloudformation.Context:
        why: ECS resolves task definition secrets with the execution role; without this grant a revision that references the three secrets cannot start tasks
        must:
          - Attach to the verified existing execution role name only.
          - Grant secretsmanager:GetSecretValue on exactly the three secret ARNs and nothing else.
          - Never use a wildcard Resource or a partial-ARN pattern.
    Properties:
      PolicyName: asaas-production-wiring-secret-read
      Roles:
        - neurostack-staging-ecs-execution
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadOnlyTheThreeWiringSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Ref AsaasApiKeySecretArn
              - !Ref AsaasWebhookTokenSecretArn
              - !Ref BillingObservabilitySmokeTokenSecret

Outputs:
  BillingObservabilitySmokeTokenSecretArn:
    Description: Exact smoke token secret ARN to reference from the task definition (the value is never output).
    Value: !Ref BillingObservabilitySmokeTokenSecret
  ExecutionRolePolicyName:
    Description: Name of the additive inline policy on the execution role.
    Value: asaas-production-wiring-secret-read
