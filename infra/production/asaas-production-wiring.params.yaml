# Reviewed, non-secret parameters for the Group 9 D3 production wiring
# (infra/production/asaas-production-wiring.yaml). The three ASAAS values were
# confirmed by the product owner on 2026-10-18. Secrets never belong here:
# the task definition references them by ARN only.
#
# scripts/asaas_production_wiring.py --params <this file> fails the plan when a
# required value is missing, empty or invalid. Each URL is validated with the
# application's own settings validators and must use a host the ALB serves.
schema_version: asaas_production_wiring_parameters.v1
parameters:
  # Hosted-checkout browser return page: the published /billing route.
  ASAAS_CHECKOUT_RETURN_URL: https://payments.staging.api.neurostack.global/billing
  # Public receiver registered at ASAAS; the path must be exactly
  # /v1/billing/webhook/asaas.
  ASAAS_WEBHOOK_URL: https://staging.api.neurostack.global/v1/billing/webhook/asaas
  # Operator address ASAAS notifies about webhook queue problems.
  ASAAS_WEBHOOK_NOTIFICATION_EMAIL: neurostack.infra@gmail.com
  # The billing.fact.v1 outbox worker, rendered as the app environment value
  # BILLING_FACT_WORKER_ENABLED. Exactly the quoted string 'false' or 'true';
  # a YAML boolean (true, yes, on), any other spelling or a missing value fails
  # the plan. The repository says 'true' since E7-B1, the reviewed PR that
  # turned the repository parameter on deliberately (owner decision
  # 2026-10-22: the flag first, on the bridge image, observed, then the E7
  # image in a later revision of its own). Merging this line changes nothing live by itself: the new
  # revision is planned, registered and deployed by the operator under its own
  # approvals. Turning the worker off again is the same kind of PR: this line
  # back to 'false' and the pin tests in
  # tests/scripts/test_asaas_production_wiring.py changed with it, then a new
  # revision (docs/runbooks/asaas-deployment.md, "The outbox worker flag").
  BILLING_FACT_WORKER_ENABLED: 'true'
  # The credit switch and the fact transport (asaas-rollout-opening Decisions
  # 12 and 13), rendered as the app environment values of the same names.
  # Exactly the quoted string 'false' or 'true', like the worker flag. Both
  # rows enter the task definition together, both 'false', in a revision of
  # their own with the image that already serves (live step L2a); each value
  # then becomes 'true' alone, through its own reviewed PR and revision: the
  # credit switch at L5, the transport at L6.
  CREDIT_HOT_PATH_ENABLED: 'false'
  BILLING_FACT_TRANSPORT_ENABLED: 'false'
  # The AppConfig group (Decision 14, live step L7): null renders no
  # APPCONFIG_* name (financial egress closed by absence). All three set, to
  # the reviewed AppConfig application, environment and configuration
  # profile (name or ID), renders the complete group with APPCONFIG_ENABLED
  # 'true' and APPCONFIG_SOURCE sdk, which the planner writes itself; a part
  # of the three fails the plan.
  APPCONFIG_APPLICATION: null
  APPCONFIG_ENVIRONMENT: null
  APPCONFIG_PROFILE: null
  # null keeps the live app image reference exactly. A value must be an
  # immutable <account ECR repository URI>@sha256:<digest> that exists in ECR;
  # building and attesting that image is a separate gate. It is an apply-time
  # input: the operator plans from a local copy with it set. Another digest of
  # the repository the service runs is the image bump
  # (docs/runbooks/asaas-deployment.md, "The image bump").
  app_image_override: null
