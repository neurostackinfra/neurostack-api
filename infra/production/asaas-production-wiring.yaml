secrets:
  kms_key_arn: arn:aws:kms:us-east-1:388460142431:key/90eff49a-c2bf-4836-834f-d5666294d956
  stack_name: neurostack-asaas-production-wiring
  template: infra/production/asaas-production-wiring-secret-access.yaml
  execution_role_policy_name: asaas-production-wiring-secret-read
  # Terraform owns this inline policy; the wiring never edits it.
  terraform_execution_policy_name: segredos-e-logs
  references:
    - environment_name: ASAAS_API_KEY
      secret_name: neurostack/staging/asaas-api-key
      source: existing
      stack_parameter: AsaasApiKeySecretArn
    - environment_name: ASAAS_WEBHOOK_TOKEN
      secret_name: neurostack/staging/asaas-webhook-token
      source: existing
      stack_parameter: AsaasWebhookTokenSecretArn
    - environment_name: BILLING_OBSERVABILITY_SMOKE_TOKEN
      secret_name: neurostack/staging/billing-observability-smoke-token
      source: created_by_stack
      stack_parameter: null

parameters:
  file: infra/production/asaas-production-wiring.params.yaml
  required:
    ASAAS_CHECKOUT_RETURN_URL:
      validator: Settings.validate_asaas_checkout_return_url
      path: /billing
    ASAAS_WEBHOOK_URL:
      validator: Settings.validate_asaas_webhook_url
      path: /v1/billing/webhook/asaas
    ASAAS_WEBHOOK_NOTIFICATION_EMAIL:
      validator: operator_email
      path: null
    # The outbox worker flag: exactly the string 'false' or 'true'.
    BILLING_FACT_WORKER_ENABLED:
      validator: exact_false_or_true
      path: null
    # The credit switch and the fact transport (asaas-rollout-opening
    # Decisions 12 and 13): exactly the string 'false' or 'true', rendered in
    # every revision from live step L2a on.
    CREDIT_HOT_PATH_ENABLED:
      validator: exact_false_or_true
      path: null
    BILLING_FACT_TRANSPORT_ENABLED:
      validator: exact_false_or_true
      path: null
  optional:
    app_image_override:
      validator: ecr_image_digest_reference
      path: null
    # The AppConfig group (Decision 14, live step L7): all three null, or all
    # three AppConfig identifiers (name or ID).
    APPCONFIG_APPLICATION:
      validator: appconfig_identifier_all_or_none
      path: null
    APPCONFIG_ENVIRONMENT:
      validator: appconfig_identifier_all_or_none
      path: null
    APPCONFIG_PROFILE:
      validator: appconfig_identifier_all_or_none
      path: null

task_definition:
  source_revision: 8
  app_secrets_added:
    - ASAAS_API_KEY
    - ASAAS_WEBHOOK_TOKEN
    - BILLING_OBSERVABILITY_SMOKE_TOKEN
  app_environment_added:
    ASAAS_WEBHOOK_URL:
      parameter: ASAAS_WEBHOOK_URL
    ASAAS_CHECKOUT_RETURN_URL:
      parameter: ASAAS_CHECKOUT_RETURN_URL
    ASAAS_WEBHOOK_NOTIFICATION_EMAIL:
      parameter: ASAAS_WEBHOOK_NOTIFICATION_EMAIL
    # Rendered from the reviewed parameter (its repository value is pinned by
    # test_the_repository_turns_the_outbox_worker_on); the name is part of the
    # D3 wiring whatever its value.
    BILLING_FACT_WORKER_ENABLED:
      parameter: BILLING_FACT_WORKER_ENABLED
    # Rendered from their reviewed parameters in every revision (L2a on).
    BILLING_FACT_TRANSPORT_ENABLED:
      parameter: BILLING_FACT_TRANSPORT_ENABLED
    CREDIT_HOT_PATH_ENABLED:
      parameter: CREDIT_HOT_PATH_ENABLED
  # The AppConfig group (Decision 14): rendered all or none, only when the
  # three parameters are set (live step L7), and the one exception to the
  # forbidden prefix APPCONFIG_. The source is always sdk: the task runs
  # exactly app and otel, so there is no AppConfig Agent container.
  app_environment_appconfig_group:
    APPCONFIG_APPLICATION:
      parameter: APPCONFIG_APPLICATION
    APPCONFIG_ENABLED:
      value: 'true'
    APPCONFIG_ENVIRONMENT:
      parameter: APPCONFIG_ENVIRONMENT
    APPCONFIG_PROFILE:
      parameter: APPCONFIG_PROFILE
    APPCONFIG_SOURCE:
      value: sdk
  forbidden_name_prefixes:
    - ABACATEPAY_
    - APPCONFIG_
  # The production image sets SPA_DIST_DIR=/app/spa itself and SPA_ENABLED
  # defaults to true; the task definition never carries them (step spa_serving).
  forbidden_names:
    - SPA_DIST_DIR
    - SPA_ENABLED
  image: preserve_live_unless_override
  # The otel collector by digest, never by tag: a deliberate pin of what the
  # :latest tag resolved to on 2026-10-19 (no behaviour change). Moving it is a
  # reviewed edit of this field.
  otel_image: public.ecr.aws/aws-observability/aws-otel-collector@sha256:7968fb60db6a2390a47ba6a2df029745638486e285c9b2487da1b722d0855a3e
  # OWNER CONFIRMED (2026-10-20, asaas-payment-gateway wish): ManagedBy=manual
  # on the two ECS IAM roles (approval A4, 2026-10-19) and on every new
  # task-definition revision, app and migrations alike (no code manages them).
  tag_overrides:
    ManagedBy: manual

# The one-off migrations family. Revision 3 bakes an unpinned upgrade, so it is
# only read (roles, the DATABASE_URL secret, sizing, logs) and never run.
# render-migrations-taskdef --window <W> --purpose migrate registers a new
# revision per window whose command is exactly that window's upgrade (the
# window table of scripts/asaas_migration_window.py), on the reviewed image
# (parameters.app_image_override; for 036, 037, 042 and 045 the image
# deployed on the service, which contains the migration). --purpose read (window 037 only,
# listed under read_revisions) registers a separate read-only revision on the
# same image, role and secret whose baked command is the window's SELECT-only
# readback program, which never invokes the migration tool (it reads the
# alembic_version table); its command and environment never mention the tool.
migrations_task_definition:
  family: neurostack-staging-migrations
  source_revision: 3
  database_secret_name: neurostack/staging/database-url-migrations
  image: app_image_override
  command: per_window_exact_upgrade
  windows: ['035', '036', '037', '042', '045']
  read_revisions: ['037']
  # OWNER CONFIRMED on 2026-10-20 (see task_definition.tag_overrides).
  tag_overrides:
    ManagedBy: manual

financial_egress:
  flag: financial_egress_enabled
  initial_state: closed
  mechanism: closed_by_absence
  why: >-
    The app reads the flag from AppConfig only when APPCONFIG_ENABLED is true.
    With no APPCONFIG_* name in the task definition every read returns false
    before any I/O, so checkout creation fails with financial_egress_disabled
    before any provider POST: that is the initial state, and it holds until
    the AppConfig group of task_definition.app_environment_appconfig_group is
    rendered (asaas-rollout-opening live step L7, a revision of its own) with
    the source sdk and an AppConfig application that exists (plan checks it).
    From then on the configuration's value opens or closes egress, set
    outside this manifest under its own owner approval. A third Agent
    container would break the evidence validators, which require exactly app
    and otel, so the Agent source is never rendered.

steps:
  - id: secret_access_stack
    scope: d3_apply
    approval: owner approved applying the D3 wiring on 2026-10-18, after an independent review of this manifest
    why: the execution role cannot read the ASAAS secrets today, so a revision that references them would fail to start tasks
    preconditions:
      - Execution role exists with exactly the inline policies segredos-e-logs (and, after apply, asaas-production-wiring-secret-read) and the attached AmazonECSTaskExecutionRolePolicy.
      - segredos-e-logs already grants kms:Decrypt on the manifest KMS key.
      - asaas-api-key and asaas-webhook-token exist, are not scheduled for deletion, use the manifest KMS key and have an AWSCURRENT version.
      - billing-observability-smoke-token does not exist outside the stack.
    change: >-
      Create the CloudFormation stack from the template with CAPABILITY_IAM and
      the two resolved ARN parameters printed by plan, through a change set
      that is described and reviewed before it is executed. Executing it with
      RetainExceptOnCreate is REQUIRED: a failed create then deletes what it
      created instead of leaving an orphaned smoke token secret behind.
    verification:
      - plan reports secret_access_stack compliant, including stack_resources_exact, stack_template_matches_reviewed_template and applied_record_matches_live_state.
      - DescribeSecret on the smoke token shows the manifest KMS key and an AWSCURRENT version.
      - GetRolePolicy shows exactly one statement with GetSecretValue on the three ARNs.
      - terraform_policy_sha256 is unchanged from the pre-apply plan.
    rollback: >-
      Not required for a service rollback: the grant is additive and may stay.
      Keep the stack while any revision the service runs, or could roll back
      to, references any of the three secrets. Only then may it be deleted;
      the smoke token secret is retained by policy and is deleted separately.
    applied:
      date: '2026-10-18'
      stack_name: neurostack-asaas-production-wiring
      change_set_name: d3-wiring-review
      execution_options: RetainExceptOnCreate
      smoke_token_secret_arn: arn:aws:secretsmanager:us-east-1:388460142431:secret:neurostack/staging/billing-observability-smoke-token-mSR8Ux
      terraform_policy_unchanged: true

  - id: task_definition_revision
    scope: d3_apply
    approval: owner approved applying the D3 wiring on 2026-10-18, after an independent review of this manifest
    why: the running revision carries no ASAAS secret or URL, so hosted checkout can never become available
    preconditions:
      - The service runs the rollback target revision (or already runs the rendered revision), with one PRIMARY deployment COMPLETED.
      - The source revision passes the existing Group 5 template validator and has none of the added names.
      - secret_access_stack is compliant, so the smoke token ARN can be read back.
      - Every required parameter is present and valid; both hosts resolve to the ALB and are covered by its certificate.
      - plan runs immediately before rendering, exits 0 and reports no block; render-taskdef refuses otherwise.
      - BILLING_FACT_WORKER_ENABLED is the reviewed parameter. The D3 approval of 2026-10-18 covered the value 'false'; while the service runs a registered D3 revision, a rendering that differs from it in that value alone (plan change worker_flag, replaces the serving revision) needs its own owner approval.
      - While the service runs a registered D3 revision, a rendering that differs from it in the app image digest alone, both pinned by digest in the same repository (plan change app_image, replaces the serving revision), needs its own owner approval; any other difference blocks.
    change: >-
      Register one new revision of the family with the request printed by
      render-taskdef. Registering does not change the service.
    verification:
      - plan reports task_definition_revision compliant (registered, not yet deployed).
      - check passes the structural evidence validators.
    rollback: >-
      None needed: the service keeps running the rollback target until the
      separately approved service_deployment step. The extra revision may be
      deregistered.

