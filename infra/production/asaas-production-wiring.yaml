# Group 9 D3/D4 production wiring for asaas-payment-gateway.
#
# Declarative and inert: no code in this repository applies it. The operator
# applies the d3_apply steps by hand after an independent review and the
# owner's approval; every separate_approval step needs its own explicit owner
# instruction and is never performed from this file.
#
# scripts/asaas_production_wiring.py reads it:
#   check-manifest   static validation of this file, the parameters file and
#                    the CloudFormation template (no AWS access)
#   plan             read-only AWS readback compared with this manifest
#   render-taskdef   the proposed task definition (secrets as references only)
#   check            the existing evidence validators against that rendering
#   render-migrations-taskdef --window 035|036|037 --purpose migrate|read
#                    a new one-off migrations revision with that window's
#                    pinned upgrade (migrate), or window 037's SELECT-only
#                    readback (read); no default window or purpose
#
# scripts/asaas_deploy_hook.py (pure, readback files only) plans, renders and
# verifies the post-deploy webhook registration task (step
# webhook_exposure_and_registration).
#
# scripts/asaas_migration_window.py (pure, readback files only) holds the
# window table (035, 036, 037) and plans, renders and verifies each window's
# snapshot, SELECT-only readbacks and one-off migration task (steps
# migrations_033_035, migrations_036 and migrations_037).
schema_version: asaas_production_wiring_manifest.v1
context:
  arch: additive IAM grant and one new secret through a reviewed CloudFormation stack, then one task definition revision derived from the D3 source revision and, per migration window, one migrations revision baking that window's pinned upgrade; the post-deploy hook (scripts/asaas_deploy_hook.py) renders the webhook registration task and scripts/asaas_migration_window.py runs the windows; the rollback target is the field rollback_target; financial egress stays closed by the absence of any AppConfig configuration
  must:
    - Read AWS only through Describe*, Get* and List* calls; never call GetSecretValue and never print a secret value.
    - Resolve every secret ARN, random suffix included, from DescribeSecret at plan time.
    - Derive the new revision from the D3 source revision (task_definition.source_revision); change only the names listed under task_definition, the otel image (task_definition.otel_image, a digest) and the tags in task_definition.tag_overrides.
    - The service rollback target is the field rollback_target; code paths read it from here and it moves only through its documented re-pin.
    - Keep exactly the containers app and otel; otel keeps an empty environment and no secrets.
    - Never introduce a name listed under task_definition.forbidden_name_prefixes or forbidden_names.
    - Keep financial_egress_enabled closed; opening it is a separate, unwritten follow-up.
    - Steps with scope separate_approval are never performed from this manifest.
  ref:
    - at: .genie/wishes/asaas-payment-gateway/WISH.md
      has: Group 9 deliverables 3 and 4; Review Results 2026-10-18 hosts and D3 apply approval
      scope: acceptance contract
    - at: docs/runbooks/asaas-deployment.md
      has: ordered procedure, gates, verification and build network needs
      scope: operations
    - at: docs/runbooks/asaas-rollback.md
      has: service rollback to the rollback target and circuit breaker behaviour
      scope: operations

target:
  account_id: '388460142431'
  region: us-east-1
  cluster: neurostack-staging
  service: neurostack-staging-app
  task_family: neurostack-staging-app
  execution_role_name: neurostack-staging-ecs-execution
  task_role_name: neurostack-staging-ecs-task
  # The service serves production traffic with ENVIRONMENT=staging. Never gate
  # anything on settings.is_production for this target.
  application_environment: staging
  operational_role: production-serving
  load_balancer_name: neurostack-staging-alb
  hosted_zone_name: api.neurostack.global
  # Builder users reach both hosts, clinic users only the first, super_admin both.
  served_hosts:
    - staging.api.neurostack.global
    - payments.staging.api.neurostack.global

# Where a failed service deployment goes back to. Code reads this field (never
# a constant). Revision 8 stays the target while the bridge revision 9 is under
# observation; revision 8 runs code that reads columns migration 036 drops, so
# the re-pin below is a reviewed edit of this field made after revision 9 has
# served and its observation period closed, and before migration 036 runs.
rollback_target:
  revision: 8
  effective_after: initial_d3_planning_2026_10_18
  repin:
    revision: 9
    effective_after: bridge_revision_9_serving_verified_and_observation_closed
    before: migration_036
    why: >-
      Revision 8 (image of 2026-10-14) reads legacy columns that migration 036
      drops, so after 036 a rollback to it would fail at runtime. Revision 9,
      the D3 rendering on the bridge image pinned by digest, is the first
      revision safe after 036. Re-pinning earlier would leave no safe way back
      while revision 9 is still under observation.

secrets:
  kms_key_arn: arn:aws:kms:us-east-1:388460142431:key/90eff49a-c2bf-4836-834f-d5666294d956
  stack_name: neurostack-asaas-production-wiring
  template: infra/production/asaas-production-wiring-secret-access.yaml
  execution_role_policy_name: asaas-production-wiring-secret-read
  # Terraform owns this inline policy; the wiring never edits it.
  terraform_execution_policy_name: segredos-e-logs
  references:
    - environment_name: ASAAS_API_KEY
      secret_name: neurostack/staging/asaas-api-key
      source: existing
      stack_parameter: AsaasApiKeySecretArn
    - environment_name: ASAAS_WEBHOOK_TOKEN
      secret_name: neurostack/staging/asaas-webhook-token
      source: existing
      stack_parameter: AsaasWebhookTokenSecretArn
    - environment_name: BILLING_OBSERVABILITY_SMOKE_TOKEN
      secret_name: neurostack/staging/billing-observability-smoke-token
      source: created_by_stack
      stack_parameter: null

parameters:
  file: infra/production/asaas-production-wiring.params.yaml
  required:
    ASAAS_CHECKOUT_RETURN_URL:
      validator: Settings.validate_asaas_checkout_return_url
      path: /billing
    ASAAS_WEBHOOK_URL:
      validator: Settings.validate_asaas_webhook_url
      path: /v1/billing/webhook/asaas
    ASAAS_WEBHOOK_NOTIFICATION_EMAIL:
      validator: operator_email
      path: null
  optional:
    app_image_override:
      validator: ecr_image_digest_reference
      path: null

task_definition:
  source_revision: 8
  app_secrets_added:
    - ASAAS_API_KEY
    - ASAAS_WEBHOOK_TOKEN
    - BILLING_OBSERVABILITY_SMOKE_TOKEN
  app_environment_added:
    ASAAS_WEBHOOK_URL:
      parameter: ASAAS_WEBHOOK_URL
    ASAAS_CHECKOUT_RETURN_URL:
      parameter: ASAAS_CHECKOUT_RETURN_URL
    ASAAS_WEBHOOK_NOTIFICATION_EMAIL:
      parameter: ASAAS_WEBHOOK_NOTIFICATION_EMAIL
    BILLING_FACT_WORKER_ENABLED:
      value: 'false'
  forbidden_name_prefixes:
    - ABACATEPAY_
    - APPCONFIG_
  # The production image sets SPA_DIST_DIR=/app/spa itself and SPA_ENABLED
  # defaults to true; the task definition never carries them (step spa_serving).
  forbidden_names:
    - SPA_DIST_DIR
    - SPA_ENABLED
  image: preserve_live_unless_override
  # The otel collector by digest, never by tag: a deliberate pin of what the
  # :latest tag resolved to on 2026-10-19 (no behaviour change). Moving it is a
  # reviewed edit of this field.
  otel_image: public.ecr.aws/aws-observability/aws-otel-collector@sha256:7968fb60db6a2390a47ba6a2df029745638486e285c9b2487da1b722d0855a3e
  # OWNER CONFIRMED (2026-10-20, asaas-payment-gateway wish): ManagedBy=manual
  # on the two ECS IAM roles (approval A4, 2026-10-19) and on every new
  # task-definition revision, app and migrations alike (no code manages them).
  tag_overrides:
    ManagedBy: manual

# The one-off migrations family. Revision 3 bakes an unpinned upgrade, so it is
# only read (roles, the DATABASE_URL secret, sizing, logs) and never run.
# render-migrations-taskdef --window <W> --purpose migrate registers a new
# revision per window whose command is exactly that window's upgrade (the
# window table of scripts/asaas_migration_window.py), on the reviewed image
# (parameters.app_image_override; for 036 and 037 the image deployed on the
# service, which contains the migration). --purpose read (window 037 only,
# listed under read_revisions) registers a separate read-only revision on the
# same image, role and secret whose baked command is the window's SELECT-only
# readback program, which never invokes the migration tool (it reads the
# alembic_version table); its command and environment never mention the tool.
migrations_task_definition:
  family: neurostack-staging-migrations
  source_revision: 3
  database_secret_name: neurostack/staging/database-url-migrations
  image: app_image_override
  command: per_window_exact_upgrade
  windows: ['035', '036', '037']
  read_revisions: ['037']
  # OWNER CONFIRMED on 2026-10-20 (see task_definition.tag_overrides).
  tag_overrides:
    ManagedBy: manual

financial_egress:
  flag: financial_egress_enabled
  initial_state: closed
  mechanism: closed_by_absence
  why: >-
    The app reads the flag only through the AppConfig Agent at a loopback
    origin and only when APPCONFIG_ENABLED is true
    (src/infrastructure/appconfig.py, _request_url). With no APPCONFIG_* name
    in the task definition every read returns false before any I/O, so
    checkout creation fails with financial_egress_disabled before any provider
    POST. No AppConfig application exists in the account (read back
    2026-10-18). A third Agent container would break the evidence validators,
    which require exactly app and otel.

steps:
  - id: secret_access_stack
    scope: d3_apply
    approval: owner approved applying the D3 wiring on 2026-10-18, after an independent review of this manifest
    why: the execution role cannot read the ASAAS secrets today, so a revision that references them would fail to start tasks
    preconditions:
      - Execution role exists with exactly the inline policies segredos-e-logs (and, after apply, asaas-production-wiring-secret-read) and the attached AmazonECSTaskExecutionRolePolicy.
      - segredos-e-logs already grants kms:Decrypt on the manifest KMS key.
      - asaas-api-key and asaas-webhook-token exist, are not scheduled for deletion, use the manifest KMS key and have an AWSCURRENT version.
      - billing-observability-smoke-token does not exist outside the stack.
    change: >-
      Create the CloudFormation stack from the template with CAPABILITY_IAM and
      the two resolved ARN parameters printed by plan, through a change set
      that is described and reviewed before it is executed. Executing it with
      RetainExceptOnCreate is REQUIRED: a failed create then deletes what it
      created instead of leaving an orphaned smoke token secret behind.
    verification:
      - plan reports secret_access_stack compliant, including stack_resources_exact, stack_template_matches_reviewed_template and applied_record_matches_live_state.
      - DescribeSecret on the smoke token shows the manifest KMS key and an AWSCURRENT version.
      - GetRolePolicy shows exactly one statement with GetSecretValue on the three ARNs.
      - terraform_policy_sha256 is unchanged from the pre-apply plan.
    rollback: >-
      Not required for a service rollback: the grant is additive and may stay.
      Keep the stack while any revision the service runs, or could roll back
      to, references any of the three secrets. Only then may it be deleted;
      the smoke token secret is retained by policy and is deleted separately.
    applied:
      date: '2026-10-18'
      stack_name: neurostack-asaas-production-wiring
      change_set_name: d3-wiring-review
      execution_options: RetainExceptOnCreate
      smoke_token_secret_arn: arn:aws:secretsmanager:us-east-1:388460142431:secret:neurostack/staging/billing-observability-smoke-token-mSR8Ux
      terraform_policy_unchanged: true

  - id: task_definition_revision
    scope: d3_apply
    approval: owner approved applying the D3 wiring on 2026-10-18, after an independent review of this manifest
    why: the running revision carries no ASAAS secret or URL, so hosted checkout can never become available
    preconditions:
      - The service runs the rollback target revision (or already runs the rendered revision), with one PRIMARY deployment COMPLETED.
      - The source revision passes the existing Group 5 template validator and has none of the added names.
      - secret_access_stack is compliant, so the smoke token ARN can be read back.
      - Every required parameter is present and valid; both hosts resolve to the ALB and are covered by its certificate.
      - plan runs immediately before rendering, exits 0 and reports no block; render-taskdef refuses otherwise.
    change: >-
      Register one new revision of the family with the request printed by
      render-taskdef. Registering does not change the service.
    verification:
      - plan reports task_definition_revision compliant (registered, not yet deployed).
      - check passes the structural evidence validators.
    rollback: >-
      None needed: the service keeps running the rollback target until the
      separately approved service_deployment step. The extra revision may be
      deregistered.

  - id: financial_egress_closed
    scope: d3_apply
    approval: no AWS change
    why: financial egress must stay closed until a separate owner instruction opens it
    preconditions:
      - No APPCONFIG_* name in the source or the rendered revision.
    change: none
    verification:
      - plan reports financial_egress_closed compliant.
    rollback: none

  - id: signed_image_build_and_attestation
    scope: separate_approval
    approval: separate owner approval required; not performed by this manifest
    why: the running image predates the SPA and the latest billing code; production images are built, signed and attested only by the protected workflows
    preconditions:
      - The release-candidate gate passed for the candidate commit.
      - The build runner can reach the network hosts listed in docs/runbooks/asaas-deployment.md.
      - The serving revision runs an image pinned by digest (revision 9 rendered with app_image_override). Since F1 path A (T3) the protected deploy path accepts the D3 names and a digest-pinned bridge image; revision 8 is rejected only because it runs a mutable tag.
      - F1 residual 5 (DATABASE_URL runtime fingerprint) is fixed and reviewed before the first protected deploy (known block below).
    change: protected build workflow, then attestation registration
    verification:
      - The attestation readback names the exact image digest.
    rollback: none (an unused image digest is inert)

  - id: migrations_033_035
    scope: separate_approval
    approval: separate owner approval required; not performed by this manifest
    why: the image built from main needs the schema at Alembic revision 035; production was read at 032 on 2026-10-17
    preconditions:
      - Read back the exact revision first (the window's SELECT-only pre-read, with the zero reads of scripts/migration_033_035_zero_reads.sql); continue only if alembic_version == 032 and every count is 0.
      - Expand-only window; the running image keeps working on the expanded schema.
      - Manual RDS snapshot pre-033-035-<date> available and recent before the run.
      - Revisions 036 and 037 are outside this window; each needs its own explicit owner instruction, 036 before 037, after a fresh SELECT showing zero legacy rows.
    change: register a new neurostack-staging-migrations revision with render-migrations-taskdef --window 035 --purpose migrate (the bridge image digest, the command baked to exactly `alembic upgrade 035`, the roles and database-url-migrations secret of revision 3, ManagedBy=manual) and run that revision once as a one-off task with no command override, through scripts/asaas_migration_window.py --window 035 (plan, render-run-task, verify-result); revision 3 is never run (never the head)
    verification:
      - read back alembic_version == 035 (exact; 036 and 037 not applied), with the window's post-read after verify-result reports the three upgrade lines 032 -> 033 -> 034 -> 035.
    rollback: none; never downgrade the schema as part of a rollback

  - id: service_deployment
    scope: separate_approval
    approval: separate owner approval required; not performed by this manifest
    why: registering a revision changes nothing until the service runs it
    preconditions:
      - Deployment circuit breaker enabled with rollback; minimum healthy 100, maximum 200.
      - The ASAAS key secret holds a production-namespace key and the webhook token is 32 to 255 printable ASCII characters (checked by the owner without printing).
    change: >-
      Path A (owner approval A1, 2026-10-19): update the service to the
      registered D3 revision 9 (bridge image pinned by digest) with the current
      tooling, outside the protected path. After the deployment is COMPLETED
      the deploy hook registers the webhook (step
      webhook_exposure_and_registration). Path B (one protected deployment
      carrying image and wiring) was not chosen; it would also need a reviewed
      exception to the runtime fingerprint equality check.
    verification:
      - All tasks RUNNING on the new revision, target group healthy, GET /ready 200 on every task.
      - The webhook readiness gauge neurostack_billing_webhook_config_ready is 0 until registration (expected).
    rollback: update the service back to the rollback_target revision; the circuit breaker does this automatically when tasks fail to become healthy. A failed webhook registration is never a reason to roll back.

  - id: spa_serving
    scope: separate_approval
    approval: separate owner approval required (it arrives with the signed image); not performed by this manifest
    why: the SPA files exist only in images built with the frontend-build stage, which sets SPA_DIST_DIR=/app/spa itself
    preconditions:
      - The deployed image was built from a commit with the frontend-build stage.
    change: none in the task definition
    verification:
      - GET / and GET /billing on both hosts return the SPA with the enforced CSP.
      - Builder browser check after checkout returns from the other host (session is per origin).
    rollback: service rollback; SPA_ENABLED=false would be a new reviewed revision, not part of this manifest

  - id: webhook_exposure_and_registration
    scope: separate_approval
    approval: separate owner approval required for each deployment it follows; owner decision A2 (2026-10-19) made the registration automatic at deploy, run by the deploy hook and never from this manifest
    why: ASAAS must deliver to the public receiver, and checkout stays unavailable until the provider webhook reads back converged
    preconditions:
      - ALB 443 forwards every path to the service target group; no listener rule shadows the receiver path.
      - AuthMiddleware makes /v1/billing/webhook/asaas public by exact match only; every other non-public path still requires a JWT.
      - The WAF web ACL counts but blocks nothing.
      - The operator entry point python -m src.ops.asaas_webhook (src/ops/asaas_webhook.py, PR #120) is in the tree and in the deployed image; plan checks the file at plan time and reports F3_webhook_registration_entry_point:missing while it is absent.
    change: >-
      After the service deployment is COMPLETED, scripts/asaas_deploy_hook.py
      plans (single flight by startedBy), renders one ecs:RunTask of
      python -m src.ops.asaas_webhook reconcile on the deployed revision
      (private subnets, no public IP, count 1) and verifies the stopped task:
      exit 0 with verdict ready is registered; anything else is the alert
      DEPLOYED_WEBHOOK_PENDING.
    verification:
      - verify-result outcome registered (app exit code 0, verdict ready, one result line, no forbidden material in the log stream).
      - The gauge neurostack_billing_webhook_config_ready reads 1 on every worker within one refresher period.
    rollback: >-
      None from the hook: DEPLOYED_WEBHOOK_PENDING is an alert, never a service
      rollback and never a service update. Disabling or deleting the provider
      webhook at ASAAS is a manual provider operation with its own approval.

  - id: migrations_036
    scope: separate_approval
    approval: separate owner approval required for this window alone (confirmed on 2026-10-20 with the 032-036 rehearsal; the run still needs the owner's explicit order at the time); not performed by this manifest
    why: migration 036 decouples ASAAS billing from the legacy roster and drops the three columns the deployed image no longer maps
    preconditions:
      - Window 035 applied and verified first; read back the exact revision with the window's SELECT-only pre-read and continue only if alembic_version == 035.
      - The image containing 036 is deployed and running on every service task, by digest (an earlier image cannot read the 036 schema); the window's migrations revision carries that same digest.
      - rollback_target re-pinned to revision 9 (reviewed manifest edit) and revision 9 ACTIVE, because revision 8 reads columns 036 drops.
      - Manual RDS snapshot pre-036-<date> available and recent; the preflight of scripts/migration_036_preflight.sql reads every count 0 right before the run.
    change: register the window's neurostack-staging-migrations revision with render-migrations-taskdef --window 036 --purpose migrate (the deployed image digest, the command baked to exactly `alembic upgrade 036`) and run it once through scripts/asaas_migration_window.py --window 036 (plan, render-run-task, verify-result), with no command override and no propagateTags
    verification:
      - verify-result reports exactly the upgrade line 035 -> 036; then the post-read must read back alembic_version == 036.
    rollback: none from this step; the 036 downgrade is a separate owner decision (docs/runbooks/asaas-deployment.md); SQLSTATE 55P03, 40P01 or 55000 means nothing changed, report and stop

  - id: migrations_037
    scope: separate_approval
    approval: separate owner approval required for this window alone, after its own rehearsal from 032 to 037 with the downgrade to 036; not performed by this manifest
    why: migration 037 drops the legacy saga and roster objects 036 left behind
    preconditions:
      - Window 036 applied and verified first; the window's pre-read runs scripts/migration_037_readback.sql as the migration role, on the window's dedicated read revision, and must read eleven ok, the first being alembic_version == 036.
      - The image containing 037 is deployed and running on every service task, by digest; the window's migrations revision carries that same digest.
      - rollback_target stays revision 9 and revision 9 is ACTIVE.
      - Manual RDS snapshot pre-037-<date> available and recent before the run.
    change: register two separate neurostack-staging-migrations revisions on the deployed image digest, the read revision with render-migrations-taskdef --window 037 --purpose read (its command baked to the SELECT-only readback program, which never invokes the migration tool and only reads the alembic_version table) and the migrate revision with render-migrations-taskdef --window 037 --purpose migrate (the command baked to exactly `alembic upgrade 037`); run the read revision for the pre-read and the migrate revision once through scripts/asaas_migration_window.py --window 037 (plan, render-run-task, verify-result), with no command override and no propagateTags
    verification:
      - verify-result reports exactly the upgrade line 036 -> 037; then the post-read must read back alembic_version == 037 and the four legacy tables gone.
    rollback: none from this step; the 037 downgrade is a separate owner decision (docs/runbooks/asaas-deployment.md); SQLSTATE 55P03, 40P01 or 55000 means nothing changed, report and stop

  - id: rollout_transitions
    scope: separate_approval
    approval: separate owner approval required; not planned until the credit system exists
    why: canary_allowlist is a real-money state and general opens only after credits
    preconditions:
      - See docs/runbooks/asaas-deployment.md, Preconditions before any future transition request.
    change: none from this manifest
    verification:
      - GET /v1/admin/billing/rollout/readback shows the expected state.
    rollback: docs/runbooks/asaas-rollback.md

known_blocks:
  - id: F1_residual_5_database_url_fingerprint
    blocks: signed_image_build_and_attestation
    reason: >-
      F1 path A is implemented (owner approval A1, T3 2026-10-19): the
      protected deploy path accepts the revision 8 names or those plus exactly
      the D3 names, accepts a serving image in neurostack-staging pinned by
      digest (exact repository match, no prefix match), and fingerprints the
      four D3 environment values with the base ones. Revision 8 is now
      rejected only because it runs a mutable tag; render revision 9 with
      app_image_override. Still true: compare_rollout_readbacks requires equal
      before and after runtime fingerprints and the fingerprint hashes every
      secret reference, so Path B (revision 8 to image plus wiring in one
      protected deploy) fails with readback_runtime_fingerprint_sha256_changed.
      Open, residual 5: the template carries the plain DATABASE_URL ARN, the
      replacement pins it to <ARN>:::<VersionId>, and the runtime fingerprint
      normalizes the two forms differently, so the first PROTECTED deploy
      (Track B) would update the service, fail compare_rollout_readbacks and
      roll back. The hand-registered bridge path (Path A, update-service
      outside the protected path) is not affected. plan evaluates it with the
      real replacement builder and fingerprint and reports this id only while
      the two fingerprints differ; PR #118 fixes the normalization.
  - id: F3_webhook_registration_entry_point
    blocks: webhook_exposure_and_registration
    reason: >-
      Reported by plan only while src/ops/asaas_webhook.py (the operator entry
      point python -m src.ops.asaas_webhook, PR #120) is absent from the tree
      it runs from; a fact checked at plan time, not a pinned state.
