      - The image containing 037 is deployed and running on every service task, by digest; the window's migrations revision carries that same digest.
      # History: window 037 actually ran with rollback_target revision 9; the requirement of 10 applies to any later use of the tooling.
      - rollback_target stays revision 10 and revision 10 is ACTIVE.
      - Manual RDS snapshot pre-037-<date> available and recent before the run.
    change: register two separate neurostack-staging-migrations revisions on the deployed image digest, the read revision with render-migrations-taskdef --window 037 --purpose read (its command baked to the SELECT-only readback program, which never invokes the migration tool and only reads the alembic_version table) and the migrate revision with render-migrations-taskdef --window 037 --purpose migrate (the command baked to exactly `alembic upgrade 037`); run the read revision for the pre-read and the migrate revision once through scripts/asaas_migration_window.py --window 037 (plan, render-run-task, verify-result), with no command override and no propagateTags
    verification:
