# Group 9 D3/D4 production wiring for asaas-payment-gateway.
#
# Declarative and inert: no code in this repository applies it. The operator
# applies the d3_apply steps by hand after an independent review and the
# owner's approval; every separate_approval step needs its own explicit owner
# instruction and is never performed from this file.
#
# scripts/asaas_production_wiring.py reads it:
#   check-manifest   static validation of this file, the parameters file and
#                    the CloudFormation template (no AWS access)
#   plan             read-only AWS readback compared with this manifest
#   render-taskdef   the proposed task definition (secrets as references only)
#   check            the existing evidence validators against that rendering
#   render-migrations-taskdef --window 035|036|037|042|045 --purpose migrate|read
#                    a new one-off migrations revision with that window's
#                    pinned upgrade (migrate), or window 037's SELECT-only
#                    readback (read); no default window or purpose
#
# scripts/asaas_deploy_hook.py (pure, readback files only) plans, renders and
# verifies the post-deploy webhook registration task (step
# webhook_exposure_and_registration).
#
# scripts/asaas_migration_window.py (pure, readback files only) holds the
# window table (035, 036, 037, 042, 045) and plans, renders and verifies each
# window's snapshot, SELECT-only readbacks and one-off migration task (steps
# migrations_033_035, migrations_036, migrations_037, migrations_038_042 and
# migrations_043_045).
schema_version: asaas_production_wiring_manifest.v1
context:
  arch: additive IAM grant and one new secret through a reviewed CloudFormation stack, then one task definition revision derived from the D3 source revision and, per migration window, one migrations revision baking that window's pinned upgrade; the post-deploy hook (scripts/asaas_deploy_hook.py) renders the webhook registration task and scripts/asaas_migration_window.py runs the windows; the rollback target is the field rollback_target; financial egress stays closed by the absence of any AppConfig name until the AppConfig group (source sdk) is rendered in a revision of its own
  must:
    - Read AWS only through Describe*, Get* and List* calls; never call GetSecretValue and never print a secret value.
    - Resolve every secret ARN, random suffix included, from DescribeSecret at plan time.
    - Derive the new revision from the D3 source revision (task_definition.source_revision); change only the names listed under task_definition, the otel image (task_definition.otel_image, a digest) and the tags in task_definition.tag_overrides.
    - BILLING_FACT_WORKER_ENABLED renders its reviewed parameter exactly ('false' or 'true'; the repository value lives in the parameters file and is pinned by tests/scripts/test_asaas_production_wiring.py). A revision that only flips it (worker on, or off again) is its own reviewed parameters edit and owner approval; plan reports it as a register_task_definition change carrying worker_flag.
    - A revision that only moves the app image to another digest of the same repository (the image bump, from the apply-time parameter app_image_override) is its own owner approval; plan reports it as a register_task_definition change carrying app_image. An image and a worker flag change never share a revision.
    - CREDIT_HOT_PATH_ENABLED and BILLING_FACT_TRANSPORT_ENABLED render their reviewed parameters exactly ('false' or 'true') in every rendering. Their two rows enter together, both 'false', in a revision that changes nothing else, the serving image included (plan change flag_rows_added); afterwards each value flips alone in its own revision (credit_hot_path_flag, transport_flag). A row change, a flag flip and an image change never share a revision.
    - The AppConfig group (task_definition.app_environment_appconfig_group) is rendered all or none, only when its three parameters are set, in a revision that adds it alone (plan change appconfig_group_added); APPCONFIG_ENABLED is always 'true' and APPCONFIG_SOURCE always sdk, written by the planner, never parameters.
    - The service rollback target is the field rollback_target; code paths read it from here and it moves one reviewed re-pin at a time, 8 to 9 and 9 to 10 being the safety re-pins (each with its mandatory repin note while pending), 10 to 11 and later owner re-pins with no note (11, 12, 13, 16 and 17 recorded in this manifest), and above 13 any serving revision with effective_after revision_serving_verified_and_observation_closed.
    - Keep exactly the containers app and otel; otel keeps an empty environment and no secrets.
    - Never introduce a name listed under task_definition.forbidden_name_prefixes or forbidden_names; the one exception is exactly the complete AppConfig group, in the app environment (APPCONFIG_ORIGIN, APPCONFIG_TOKEN and any other APPCONFIG_ name stay forbidden).
    - Keep financial_egress_enabled closed by absence until the AppConfig group is rendered; opening it is then the AppConfig configuration's value, set outside this manifest under its own owner approval.
    - Steps with scope separate_approval are never performed from this manifest.
  ref:
    - at: .genie/wishes/asaas-payment-gateway/WISH.md
      has: Group 9 deliverables 3 and 4; Review Results 2026-10-18 hosts and D3 apply approval
      scope: acceptance contract
    - at: docs/runbooks/asaas-deployment.md
      has: ordered procedure, gates, verification and build network needs
      scope: operations
    - at: docs/runbooks/asaas-rollback.md
      has: service rollback to the rollback target and circuit breaker behaviour
      scope: operations

target:
  account_id: '388460142431'
  region: us-east-1
  cluster: neurostack-staging
  service: neurostack-staging-app
  task_family: neurostack-staging-app
  execution_role_name: neurostack-staging-ecs-execution
  task_role_name: neurostack-staging-ecs-task
  # The service serves production traffic with ENVIRONMENT=staging. Never gate
