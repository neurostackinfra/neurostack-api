    change: >-
      Path A (owner approval A1, 2026-10-19): update the service to the
      registered D3 revision 9 (bridge image pinned by digest) with the current
      tooling, outside the protected path. After the deployment is COMPLETED
      the deploy hook registers the webhook (step
      webhook_exposure_and_registration). Path B (one protected deployment
      carrying image and wiring) was not chosen; it would also need a reviewed
      exception to the runtime fingerprint equality check.
    verification:
