  - id: migrations_038_042
    scope: separate_approval
    approval: separate owner approval required for this window alone (asaas-rollout-opening, live step L3; the run needs the owner's explicit order at the time); not performed by this manifest
    why: migrations 038 to 042 create the credit schema (neurostack-credit-system); they only add tables, functions, indexes and triggers and alter nothing that existed at 037, so the app deployed before the window stays valid on either schema
    preconditions:
      - Window 037 applied and verified first; read back the exact revision with the window's SELECT-only pre-read (scripts/migration_038_042_preflight.sql, application role) and continue only if alembic_version == 037 and every count is 0 (none of the tables or functions 038 to 042 create exists yet).
      - The image containing 042 is deployed and running on every service task, by digest (live step L2, its own revision after the parameter-rows revision); the window's migrations revision carries that same digest.
      - rollback_target is revision 12 with no pending re-pin (L2a's revision, re-pinned from 11 by live step L2c, before L2b), ACTIVE, its app image pinned by digest, with exactly one BILLING_FACT_WORKER_ENABLED row, 'true', and differing from the revision the service runs (L2b's, on the image containing 042) in the app image alone; the migrations are additive, so it stays a valid way back with the schema at 042.
      - Manual RDS snapshot pre-038-042-<date> available and recent before the run.
    change: register the window's neurostack-staging-migrations revision with render-migrations-taskdef --window 042 --purpose migrate (the deployed image digest, the command baked to exactly `alembic upgrade 042`) and run it once through scripts/asaas_migration_window.py --window 042 (plan, render-run-task, verify-result), with no command override and no propagateTags
    verification:
      - verify-result reports exactly the five upgrade lines 037 -> 038 -> 039 -> 040 -> 041 -> 042; then the post-read must read back alembic_version == 042.
    rollback: none from this step; a service rollback to the rollback target stays valid on the 042 schema; restoring the snapshot is an owner decision of last resort (it loses every write made after it); SQLSTATE 55P03, 40P01 or 55000 means nothing changed, report and stop

  - id: migrations_043_045
    scope: separate_approval
    approval: separate owner approval required for this window alone (envio-midia-agente Group 1, the media bridge release; the run needs the owner's explicit order at the time); not performed by this manifest
    why: migration 045 adds the column media_assets.trigger_intents (TEXT[] NOT NULL DEFAULT '{}', so every existing row reads the empty list) and the table media_deliveries (cascading with its tenant, its session and its media asset) for the agent's media delivery; it only adds, and no ORM model of the bridge image maps either object, so the image deployed before the window stays valid on either schema; the behaviour release that maps them is merged and deployed only after this window. The same run applies 043 and 044 (ck_media_assets_category_mime widened for audio/ogg, then audio/mp4), which have no window of their own, so the window's one upgrade, from 042, runs all three in one transaction
    preconditions:
      - Window 042 applied and verified first; read back the exact revision with the window's SELECT-only pre-read (scripts/migration_043_045_preflight.sql, application role) and continue only if alembic_version == 042 and every count is 0 (neither the table media_deliveries nor the column media_assets.trigger_intents exists yet, and ck_media_assets_category_mime is exactly 042's, the constraint 043 and 044 rewrite).
      - The bridge image containing 045 is deployed and running on every service task, by digest (its own revision, the serving revision with the app image alone moved); the window's migrations revision carries that same digest. Run before that image serves, 045 would take the serving image out of its own revision chain and the credit switch would turn off (revision_outside_image_chain).
      - rollback_target is revision 17 with no pending re-pin (the revision the bridge image replaces, re-pinned from 16 by its own reviewed PR before the bridge deploy), ACTIVE, its app image pinned by digest, with exactly one BILLING_FACT_WORKER_ENABLED row, 'true', and differing from the revision the service runs (the bridge revision) in the app image alone.
      - Manual RDS snapshot pre-043-045-<date> available and recent before the run.
    change: register the window's neurostack-staging-migrations revision with render-migrations-taskdef --window 045 --purpose migrate (the deployed bridge image digest, the command baked to exactly `alembic upgrade 045`) and run it once through scripts/asaas_migration_window.py --window 045 (plan, render-run-task, verify-result), with no command override and no propagateTags
    verification:
      - verify-result reports exactly the three upgrade lines 042 -> 043 -> 044 -> 045; then the post-read (scripts/migration_043_045_post_read.sql, application role) must read back alembic_version == 045 and every privilege the behaviour release needs held by that role (SELECT, INSERT, UPDATE and DELETE on media_deliveries; SELECT, INSERT and UPDATE on media_assets.trigger_intents).
    rollback: none from this step; the service may go back to the rollback target on the 045 schema (it maps neither object), but that image does not contain 045, so its credit switch reads revision_outside_image_chain and stays off until an image containing 045 serves again; the 045 downgrade refuses while media_deliveries holds a row or a media asset has trigger intents (and the 044 and 043 downgrades fail while an audio/mp4 or audio/ogg asset exists), and in production the way back for the schema is restoring the snapshot, an owner decision of last resort (it loses every write made after it); SQLSTATE 55P03, 40P01 or 55000 means nothing changed, report and stop

