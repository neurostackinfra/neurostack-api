known_blocks:
  - id: F1_residual_5_database_url_fingerprint
    blocks: signed_image_build_and_attestation
    reason: >-
      F1 path A is implemented (owner approval A1, T3 2026-10-19): the
      protected deploy path accepts the revision 8 names or those plus exactly
      the D3 names, accepts a serving image in neurostack-staging pinned by
      digest (exact repository match, no prefix match), and fingerprints the
      four D3 environment values with the base ones. Revision 8 is now
      rejected only because it runs a mutable tag; render revision 9 with
      app_image_override. Still true: compare_rollout_readbacks requires equal
      before and after runtime fingerprints and the fingerprint hashes every
      secret reference, so Path B (revision 8 to image plus wiring in one
      protected deploy) fails with readback_runtime_fingerprint_sha256_changed.
      Open, residual 5: the template carries the plain DATABASE_URL ARN, the
      replacement pins it to <ARN>:::<VersionId>, and the runtime fingerprint
      normalizes the two forms differently, so the first PROTECTED deploy
      (Track B) would update the service, fail compare_rollout_readbacks and
      roll back. The hand-registered bridge path (Path A, update-service
      outside the protected path) is not affected. plan evaluates it with the
      real replacement builder and fingerprint and reports this id only while
      the two fingerprints differ; PR #118 fixes the normalization.
  - id: F3_webhook_registration_entry_point
    blocks: webhook_exposure_and_registration
    reason: >-
      Reported by plan only while src/ops/asaas_webhook.py (the operator entry
      point python -m src.ops.asaas_webhook, PR #120) is absent from the tree
      it runs from; a fact checked at plan time, not a pinned state.
