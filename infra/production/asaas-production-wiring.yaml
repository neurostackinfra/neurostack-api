  - id: webhook_exposure_and_registration
    scope: separate_approval
    approval: separate owner approval required for each deployment it follows; owner decision A2 (2026-10-19) made the registration automatic at deploy, run by the deploy hook and never from this manifest
    why: ASAAS must deliver to the public receiver, and checkout stays unavailable until the provider webhook reads back converged
    preconditions:
      - ALB 443 forwards every path to the service target group; no listener rule shadows the receiver path.
      - AuthMiddleware makes /v1/billing/webhook/asaas public by exact match only; every other non-public path still requires a JWT.
      - The WAF web ACL counts but blocks nothing.
      - The operator entry point python -m src.ops.asaas_webhook (src/ops/asaas_webhook.py, PR #120) is in the tree and in the deployed image; plan checks the file at plan time and reports F3_webhook_registration_entry_point:missing while it is absent.
    change: >-
      After the service deployment is COMPLETED, scripts/asaas_deploy_hook.py
      plans (single flight by startedBy), renders one ecs:RunTask of
      python -m src.ops.asaas_webhook reconcile on the deployed revision
      (private subnets, no public IP, count 1) and verifies the stopped task:
      exit 0 with verdict ready is registered; anything else is the alert
      DEPLOYED_WEBHOOK_PENDING.
    verification:
      - verify-result outcome registered (app exit code 0, verdict ready, one result line, no forbidden material in the log stream).
      - The gauge neurostack_billing_webhook_config_ready reads 1 on every worker within one refresher period.
    rollback: >-
      None from the hook: DEPLOYED_WEBHOOK_PENDING is an alert, never a service
      rollback and never a service update. Disabling or deleting the provider
      webhook at ASAAS is a manual provider operation with its own approval.

  - id: migrations_036
    scope: separate_approval
    approval: separate owner approval required for this window alone (confirmed on 2026-10-20 with the 032-036 rehearsal; the run still needs the owner's explicit order at the time); not performed by this manifest
    why: migration 036 decouples ASAAS billing from the legacy roster and drops the three columns the deployed image no longer maps
    preconditions:
