"to" = '''normal'''

[["state_machine"."transitions"]]
"from" = '''safety'''
"trigger" = '''handoff_requested'''
"to" = '''handoff'''

[["state_machine"."transitions"]]
"from" = '''safety'''
"trigger" = '''reset_to_normal'''
"to" = '''normal'''

[["state_machine"."transitions"]]
"from" = '''handoff'''
"trigger" = '''handoff_completed'''
