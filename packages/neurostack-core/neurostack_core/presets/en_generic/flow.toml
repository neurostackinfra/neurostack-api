# Compact English proof-only preset for neurostack-core.
"schema_version" = 1

["protocol"]
"handoff_response_keys" = [
  '''complex_query''',
  '''connected''',
  '''default''',
  '''escalation''',
  '''explicit_request''',
  '''low_confidence''',
  '''max_turns_exceeded''',
  '''safety_concern''',
  '''scheduling''',
  '''waiting''',
]
"safety_response_keys" = [
  '''clinical_risk''',
  '''conduct_risk''',
  '''default''',
  '''emergency''',
  '''legal_risk''',
]

["handoff_responses"]
"explicit_request" = '''Sure! I will forward you to our team now. Someone will continue the conversation shortly.'''
"safety_concern" = '''To give you the best support, I am forwarding you to our specialist team. A professional will reach out shortly.'''
"max_turns_exceeded" = '''So that we can help you even better, I will forward you to the team that can continue the conversation.'''
"low_confidence" = '''To make sure you get the most accurate guidance, I am forwarding you to our specialist team.'''
"complex_query" = '''This question deserves closer attention. I will forward you to our specialist team.'''
"escalation" = '''I understand your situation. I will forward you to the responsible team so they can help you.'''
"scheduling" = '''I will forward you to our team to continue the conversation and confirm the best available times.'''
"default" = '''I will forward you to our team to continue the conversation. Please hold on a moment.'''
"waiting" = '''You are in the queue. Our team will be available shortly. Estimated time: {wait_time} minutes.'''
"connected" = '''You are now connected with {agent_name}. How can I help you?'''

["safety_responses"]
"clinical_risk" = '''I can tell you may be going through a difficult situation. Please seek professional help right away. Local emergency line: 911.'''
"legal_risk" = '''I cannot provide medical guidance, diagnoses, or prescriptions. Please consult a qualified health professional.'''
"conduct_risk" = '''Let us keep this conversation respectful. I am here to help as best I can.'''
"emergency" = '''EMERGENCY DETECTED. Please dial 911 or your local emergency number immediately.'''
"default" = '''I understand your concern. For your safety please seek appropriate professional guidance.'''

["state_machine"]
"flow_modes" = [
  '''normal''',
  '''rag''',
  '''safety''',
  '''handoff''',
]
"transition_triggers" = [
  '''safety_concern_detected''',
  '''safety_resolved''',
  '''handoff_requested''',
  '''handoff_completed''',
  '''handoff_cancelled''',
  '''rag_required''',
  '''rag_completed''',
  '''continue_normal''',
  '''reset_to_normal''',
  '''session_timeout''',
  '''session_end''',
]

["state_machine"."mode_priority"]
"normal" = 0
"rag" = 1
"safety" = 3
"handoff" = 2

[["state_machine"."transitions"]]
"from" = '''normal'''
"trigger" = '''rag_required'''
"to" = '''rag'''

[["state_machine"."transitions"]]
"from" = '''normal'''
"trigger" = '''safety_concern_detected'''
"to" = '''safety'''

[["state_machine"."transitions"]]
"from" = '''normal'''
"trigger" = '''handoff_requested'''
"to" = '''handoff'''

[["state_machine"."transitions"]]
"from" = '''normal'''
"trigger" = '''continue_normal'''
"to" = '''normal'''

[["state_machine"."transitions"]]
"from" = '''rag'''
"trigger" = '''rag_completed'''
"to" = '''normal'''

[["state_machine"."transitions"]]
"from" = '''rag'''
"trigger" = '''safety_concern_detected'''
"to" = '''safety'''

[["state_machine"."transitions"]]
