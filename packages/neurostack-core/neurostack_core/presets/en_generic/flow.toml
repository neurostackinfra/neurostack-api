[["state_machine"."transitions"]]
"from" = '''handoff'''
"trigger" = '''safety_concern_detected'''
"to" = '''safety'''

[["state_machine"."transitions"]]
"from" = '''normal'''
"trigger" = '''session_end'''
"to" = '''normal'''

[["state_machine"."transitions"]]
"from" = '''rag'''
"trigger" = '''session_end'''
"to" = '''normal'''

[["state_machine"."transitions"]]
"from" = '''safety'''
"trigger" = '''session_end'''
"to" = '''normal'''

[["state_machine"."transitions"]]
