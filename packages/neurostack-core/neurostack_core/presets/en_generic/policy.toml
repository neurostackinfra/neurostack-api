[["rules"]]
"rule_id" = '''C_MEDICAL_NO_DIAGNOSIS'''
"rule" = '''no_medical_diagnosis'''
"message" = '''I cannot provide medical diagnoses. For a proper evaluation please consult a health professional.'''
"description" = '''Prohibits the agent from providing medical diagnoses.'''
"category" = '''safety_clinical'''
"severity" = '''critical'''
"action" = '''block'''
"patterns" = [
  '''what is my diagnosis''',
  '''tell me what i have''',
  '''what disease do i have''',
  '''diagnose me''',
]
"keywords" = [
  '''diagnosis''',
  '''diagnose''',
  '''what disease''',
]
"enabled" = true
"metadata" = {}

