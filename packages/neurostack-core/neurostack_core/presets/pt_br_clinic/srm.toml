["safety_patterns"."clinical_risk"]
"description" = '''Medical/clinical safety concerns'''
"patterns" = [
  '''\b(infarto|avc|derrame|convulsão|convulsao|desmaio|desmaiando)\b''',
  '''\b(não|nao)\b.*\b(consigo|consegue)\b.*\b(respirar|respira)\b''',
  '''\b(dor)\b.*\b(peito|tórax|torax)\b.*\b(forte|intensa|aguda)\b''',
  '''\b(sangue|sangramento)\b.*\b(muito|demais|intenso|não para)\b''',
  '''\b(perda)\b.*\b(consciência|consciencia|sentidos)\b''',
  '''\b(suicídio|suicidio|me matar|matar\s?me|acabar com tudo)\b''',
  '''\b(não|nao)\b.*\b(quero|aguento)\b.*\b(viver|vida)\b''',
  '''\b(automutilação|automutilacao|me cortar|me machucar)\b''',
  '''\b(overdose|intoxicação|intoxicacao|envenenamento)\b''',
  '''\b(tomei|ingerir?)\b.*\b(muito|demais|todo|remédio|medicamento)\b''',
  '''\b(sangramento|hemorragia)\b.*\b(grávida|gravida|gestante)\b''',
  '''\b(contrações|contracoes)\b.*\b(forte|muita|parto)\b''',
  '''\b(bebê|bebe|criança|crianca)\b.*\b(engasgou|engasgando|não respira)\b''',
  '''\b(febre)\b.*\b(muito alta|40|41|convulsão)\b''',
]
"keywords" = [
  '''emergência médica''',
  '''urgência''',
  '''samu''',
  '''upa''',
  '''pronto socorro''',
  '''passando mal''',
  '''dor forte''',
  '''não consigo respirar''',
  '''me ajuda''',
  '''suicídio''',
  '''me matar''',
  '''não aguento mais''',
]
"action" = '''escalate'''
"urgency" = '''critical'''

