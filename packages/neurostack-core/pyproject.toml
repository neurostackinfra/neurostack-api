[tool.poetry]
name = "neurostack-core"
version = "0.1.0"
description = "Framework-independent cognitive core for NeuroStack"
authors = ["NeuroStack Team <team@neurostack.ai>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "neurostack_core" }]
include = [
    { path = "scripts/*.py", format = "sdist" },
    { path = "neurostack_core/presets/**/*.toml", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = ">=2.5.3"
prometheus-client = ">=0.19.0"
tzdata = ">=2024.1"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
