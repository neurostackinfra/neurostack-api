[tool.poetry]
name = "neurostack-api"
version = "0.1.0"
description = "NeuroStack - Cognitive Infrastructure for AI Agents in Healthcare"
authors = ["NeuroStack Team <team@neurostack.ai>"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.142.4,<0.143.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = {extras = ["email"], version = "^2.5.3"}
pydantic-settings = "^2.14.2"
redis = "^5.0.1"
asyncpg = "^0.29.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
alembic = "^1.13.1"
python-dotenv = "^1.0.0"
httpx = "^0.26.0"
python-multipart = ">=0.0.32,<0.1.0"
PyJWT = ">=2.15.0"
cryptography = ">=50.0.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "4.0.1"  # Fix: passlib 1.7.4 is incompatible with bcrypt >= 4.1.0
tenacity = "^8.2.3"
structlog = "^24.1.0"
opentelemetry-api = "^1.44.0"
opentelemetry-sdk = "^1.44.0"
opentelemetry-instrumentation-fastapi = "^0.65b0"
opentelemetry-instrumentation-redis = "^0.65b0"
opentelemetry-instrumentation-sqlalchemy = "^0.65b0"
prometheus-client = "^0.19.0"
qdrant-client = "^1.7.0"
aiosmtplib = "^5.1.2"
anyio = ">=4.14.2,<5"
h2 = ">=4.4.1,<5"
hpack = ">=4.2.0,<5"
idna = ">=3.15,<4"
urllib3 = ">=2.8.0,<3"
tzdata = ">=2024.1"
lingua-language-detector = "2.1.1"
# AWS SDK: the KMS receipt and grant signers (src/api/routes/billing_producer*.py)
# import it at request time and fail closed when it is missing.
boto3 = ">=1.43.0,<2"
botocore = ">=1.43.0,<2"
neurostack-core = {path = "packages/neurostack-core", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
httpx = "^0.26.0"
black = "^26.3.1"
isort = "^5.13.2"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^4.5.1"
faker = "^22.0.0"
factory-boy = "^3.3.0"
locust = "^2.22.0"
msgpack = ">=1.2.1,<2"
python-engineio = ">=4.13.2,<5"
python-socketio = ">=5.16.2,<6"
setuptools = ">=83.0.0"
virtualenv = ">=21.7.13"
werkzeug = ">=3.1.9"
aiosqlite = "^0.22.1"
build = "^1.2.2"
pip-audit = "==2.9.0"
hypothesis = "==6.168.5"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.3"
mkdocs-material = "^9.7.7"
pymdown-extensions = ">=11.0.1,<12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = [".git", ".venv", "migrations"]
known_first_party = ["src", "neurostack_core"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "asyncio: Async tests",
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src", "packages/neurostack-core/neurostack_core"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
