# ============================================
# NeuroStack API - Flake8 Configuration
# ============================================

[flake8]
max-line-length = 88
extend-ignore = E203, E501, W503
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    migrations,
    *.egg-info
per-file-ignores =
    __init__.py:F401
    tests/*:S101,S105,S106

[tool:pytest]
testpaths = tests
asyncio_mode = auto

[coverage:run]
source = src
branch = True
omit =
    */tests/*
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:

